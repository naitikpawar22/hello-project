{% extends 'base.html' %}

{% block body %}
<div class="app-shell">
  {% include 'partials_nav.html' %}

  <main class="content">

    <header class="page-header">
      <div>
        <span class="eyebrow">CONTENT</span>
        <h1>Question Banks</h1>
      </div>

      <form id="importForm" class="inline-form">
        <input
          name="name"
          placeholder="Bank name"
          required
        />

        <input
          name="file"
          type="file"
          accept=".pdf,.xml,.html,.docx,.xlsx,.xlsm,.csv"
          required
        />

        <button
          type="submit"
          class="btn btn-primary"
        >
          Import
        </button>
      </form>
    </header>

    <section id="banks" class="card-grid"></section>

  </main>
</div>
{% endblock %}


{% block scripts %}
<script>

  requireAuth().then(loadBanks);


  /*
  |--------------------------------------------------------------------------
  | Load question banks
  |--------------------------------------------------------------------------
  */

  async function loadBanks() {

    try {

      const d = await api("/api/question-banks");

      if (!d.question_banks?.length) {
        banks.innerHTML = empty("No question banks yet.");
        return;
      }

      banks.innerHTML = d.question_banks
        .map((b) => {

          return `
            <article class="panel question-bank-card">

              <div>
                <h3>${escapeHtml(b.name)}</h3>

                <p class="muted">
                  ${escapeHtml(
                    b.description || "No description"
                  )}
                </p>

                <div class="mini-stats">

                  <span>
                    ${escapeHtml(
                      b.question_count ?? 0
                    )} questions
                  </span>

                  <span>
                    ${escapeHtml(
                      b.source_format || "manual"
                    )}
                  </span>

                </div>
              </div>


              <div class="action-group">

                <button
                  type="button"
                  class="btn btn-sm btn-secondary"
                  onclick="openQuestionBank('${escapeHtml(b.id)}')"
                >
                  Open
                </button>

                <button
                  type="button"
                  class="btn btn-sm btn-danger"
                  onclick="deleteQuestionBank('${escapeHtml(b.id)}')"
                >
                  Delete
                </button>

              </div>

            </article>
          `;

        })
        .join("");

    } catch (error) {

      console.error(
        "Failed to load question banks:",
        error
      );

    }

  }


  /*
  |--------------------------------------------------------------------------
  | Open question bank
  |--------------------------------------------------------------------------
  */

  function openQuestionBank(id) {

    location.href =
      "/admin/question-bank-detail?bank=" +
      encodeURIComponent(id);

  }


  /*
  |--------------------------------------------------------------------------
  | Delete question bank
  |--------------------------------------------------------------------------
  */

  async function deleteQuestionBank(id) {

    const confirmed = window.confirm(
      "Are you sure you want to delete this question bank?\n\n" +
      "All questions belonging to this bank will also be removed.\n\n" +
      "This action cannot be undone."
    );

    if (!confirmed) {
      return;
    }


    try {

      await api(
        "/api/question-banks/" +
          encodeURIComponent(id),
        "DELETE"
      );

      toast(
        "Question bank deleted successfully."
      );

      await loadBanks();

    } catch (error) {

      console.error(
        "Question bank deletion failed:",
        error
      );

    }

  }


  /*
  |--------------------------------------------------------------------------
  | Import question bank
  |--------------------------------------------------------------------------
  */

  importForm.onsubmit = async (e) => {

    e.preventDefault();

    try {

      const fd = new FormData(importForm);

      await apiForm(
        "/api/question-banks/import",
        fd
      );

      importForm.reset();

      await loadBanks();

    } catch (error) {

      console.error(
        "Question bank import failed:",
        error
      );

    }

  };

</script>
{% endblock %}
