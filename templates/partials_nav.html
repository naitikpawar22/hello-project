<script>
  (function() {
    const currentPath = window.location.pathname;
    document.querySelectorAll('.sidebar a[data-path]').forEach(link => {
      if (currentPath === link.getAttribute('data-path') || (currentPath.startsWith(link.getAttribute('data-path')) && link.getAttribute('data-path') !== '/admin/dashboard')) {
        link.classList.add('active');
      }
    });

    if (window.currentUser) {
      const badge = document.getElementById('currentUserBadge');
      const nameEl = document.getElementById('currentUserName');
      if (badge && nameEl) {
        nameEl.textContent = window.currentUser.name || window.currentUser.email || 'Admin';
        badge.style.display = 'block';
      }
    }
  })();
</script>
