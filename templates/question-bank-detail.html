{% extends 'base.html' %}{% block body %}
<div class="app-shell">
  {% include 'partials_nav.html' %}
  <main class="content">
    <header class="page-header">
      <div>
        <span class="eyebrow">QUESTION REVIEW</span>
        <h1 id="bankTitle">Question Bank</h1>
        <p id="bankMeta" class="muted"></p>
      </div>
    </header>
    <section id="questionList" class="stack"></section>
  </main>
</div>
{% endblock %}{% block scripts %}
<script>
  requireAuth().then(loadBank);
  async function loadBank() {
    const id = new URLSearchParams(location.search).get("bank");
    const d = await api("/api/question-banks/" + id);
    if (!d.question_bank) return;
    bankTitle.textContent = d.question_bank.name;
    bankMeta.textContent = `${d.question_bank.questions.length} questions · ${d.question_bank.source_format || "manual"}`;
    questionList.innerHTML =
      d.question_bank.questions
        .map(
          (q, i) =>
            `<article class="panel question-card"><div class="question-head"><span class="badge">Q${i + 1} · ${q.type}</span>${q.needs_review ? '<span class="badge warn">Review needed</span>' : ""}</div><h3>${escapeHtml(q.text)}</h3><div class="options">${q.options.map((o) => `<div class="option ${o.is_correct ? "correct" : ""}"><span>${String.fromCharCode(65 + o.index)}</span>${escapeHtml(o.text)}</div>`).join("")}</div><div class="question-meta">${q.marks} marks · −${q.negative_marks} negative · ${escapeHtml(q.topic || "No topic")}</div></article>`,
        )
        .join("") || empty("No questions.");
  }
</script>
{% endblock %}
