{% extends 'base.html' %}

{% block body %}

<main class="exam-shell">

  <!-- ======================================================
       Exam Header
       ====================================================== -->

  <header class="exam-top">

    <div>

      <div class="brand">
        <span class="brand-mark small">EF</span>
        <span>ExamForge</span>
      </div>

      <h1 id="examTitle">
        Loading exam…
      </h1>

    </div>

    <div
      class="timer"
      id="timer"
    >
      --:--
    </div>

  </header>


  <!-- ======================================================
       Start / Candidate Confirmation
       ====================================================== -->

  <section
    id="startView"
    class="panel narrow"
  >

    <h2 id="startHeading">
      Before you begin
    </h2>

    <div id="summary"></div>


    <!-- Access mode indicator -->

    <div
      id="accessInfo"
      class="setup-note"
      hidden
    ></div>


    <form id="startForm">

      <label>
        Full name

        <input
          id="candidateName"
          type="text"
          autocomplete="name"
          required
        />
      </label>


      <label>
        Email / Student ID

        <input
          id="candidateEmail"
          type="text"
          autocomplete="email"
          required
        />
      </label>


      <button
        type="submit"
        class="btn btn-primary"
        id="startExamBtn"
      >
        Start exam
      </button>

    </form>

  </section>


  <!-- ======================================================
       Exam View
       ====================================================== -->

  <section
    id="examView"
    hidden
  >

    <div class="exam-layout">

      <!-- Question navigation -->

      <aside class="panel nav-panel">

        <div id="nav"></div>

      </aside>


      <!-- Question -->

      <article class="panel question-panel">

        <div class="progress">

          <span id="progress"></span>

          <button
            type="button"
            class="btn btn-sm btn-secondary"
            id="fullscreen"
          >
            Fullscreen
          </button>

        </div>


        <h2 id="qText"></h2>


        <div id="options"></div>


        <div class="question-actions">

          <button
            type="button"
            class="btn btn-secondary"
            id="prev"
          >
            Previous
          </button>


          <button
            type="button"
            class="btn btn-primary"
            id="next"
          >
            Next
          </button>

        </div>

      </article>

    </div>


    <button
      type="button"
      class="btn btn-danger"
      id="submitBtn"
    >
      Submit exam
    </button>

  </section>

</main>

{% endblock %}


{% block scripts %}

<script>

/*
|--------------------------------------------------------------------------
| Exam access
|--------------------------------------------------------------------------
|
| PRIVATE:
| /student/exam/<invitation-token>
|
| PUBLIC:
| /exam/<exam-code>
|
| The backend will provide either:
|
|   token
| or
|   exam_code
|
|--------------------------------------------------------------------------
*/


const invitationToken =
    {{ token|default(None)|tojson }};


const publicExamCode =
    {{ exam_code|default(None)|tojson }};


let examData = null;
let attemptId = null;
let index = 0;
let answers = {};
let endAtMs = 0;
let timerInterval = null;
let securityInitialized = false;


/*
|--------------------------------------------------------------------------
| Determine access mode
|--------------------------------------------------------------------------
*/

const accessMode =
    invitationToken
        ? "PRIVATE"
        : (
            publicExamCode
                ? "PUBLIC"
                : null
        );


/*
|--------------------------------------------------------------------------
| Load exam
|--------------------------------------------------------------------------
*/

async function load() {

    try {

        let endpoint = null;

        /*
        | Private exam
        */

        if (accessMode === "PRIVATE") {

            endpoint =
                "/api/student/exams/" +
                encodeURIComponent(
                    invitationToken
                );

        }


        /*
        | Public exam
        */

        else if (accessMode === "PUBLIC") {

            endpoint =
                "/api/student/public-exams/" +
                encodeURIComponent(
                    publicExamCode
                );

        }


        /*
        | Invalid access
        */

        else {

            throw new Error(
                "No valid exam access token or exam code was provided."
            );

        }


        const data =
            await api(endpoint);


        examData = data;


        /*
        | Exam title
        */

        examTitle.textContent =
            data.exam.title;


        /*
        | Access information
        */

        renderStartInformation();


        /*
        | Pre-fill private invitation email
        */

        if (
            accessMode === "PRIVATE" &&
            data.invitation &&
            data.invitation.email
        ) {

            candidateEmail.value =
                data.invitation.email;

        }


    } catch (error) {

        console.error(
            "Exam loading failed:",
            error
        );

        startView.innerHTML = `
            <div class="empty">
                Unable to load this examination.
                <br><br>
                ${escapeHtml(
                    error.message ||
                    "The exam link is invalid or unavailable."
                )}
            </div>
        `;

    }

}


/*
|--------------------------------------------------------------------------
| Render exam start information
|--------------------------------------------------------------------------
*/

function renderStartInformation() {

    const exam =
        examData.exam;


    const questions =
        examData.questions || [];


    examTitle.textContent =
        exam.title;


    summary.innerHTML = `

        <p>
            ${escapeHtml(
                exam.description ||
                "No instructions provided."
            )}
        </p>

        <p>
            <b>Duration:</b>
            ${escapeHtml(
                exam.duration_minutes
            )}
            min
        </p>

        <p>
            <b>Questions:</b>
            ${questions.length}
        </p>

        <p>
            <b>Pass:</b>
            ${escapeHtml(
                exam.pass_percentage
            )}%
        </p>

        <p class="muted">
            Browser security events may be recorded.
            Client-side restrictions are not a substitute
            for server-side controls.
        </p>

    `;


    /*
    | Private exam
    */

    if (accessMode === "PRIVATE") {

        startHeading.textContent =
            "Before you begin";

        accessInfo.hidden = false;

        accessInfo.textContent =
            "You are accessing a private exam through a unique invitation link.";

    }


    /*
    | Public exam
    */

    if (accessMode === "PUBLIC") {

        startHeading.textContent =
            "Candidate confirmation";

        accessInfo.hidden = false;

        accessInfo.textContent =
            "This is a public/shareable examination. Confirm your candidate information before starting.";

    }

}


/*
|--------------------------------------------------------------------------
| Start attempt
|--------------------------------------------------------------------------
*/

async function start(event) {

    event.preventDefault();


    if (!examData) {

        toast(
            "Exam data is not loaded.",
            "error"
        );

        return;
    }


    const name =
        candidateName.value.trim();


    const email =
        candidateEmail.value.trim();


    if (!name) {

        toast(
            "Full name is required.",
            "error"
        );

        candidateName.focus();

        return;
    }


    if (!email) {

        toast(
            "Email or Student ID is required.",
            "error"
        );

        candidateEmail.focus();

        return;
    }


    startExamBtn.disabled = true;

    startExamBtn.textContent =
        "Starting...";


    try {

        let payload = {
            name,
            email,
        };


        /*
        | PRIVATE
        */

        if (accessMode === "PRIVATE") {

            payload.token =
                invitationToken;

        }


        /*
        | PUBLIC
        */

        else if (accessMode === "PUBLIC") {

            payload.exam_code =
                publicExamCode;

        }


        const response =
            await api(
                "/api/attempts",
                "POST",
                payload
            );


        attemptId =
            response.attempt_id;


        if (!attemptId) {

            throw new Error(
                "Server did not return an attempt ID."
            );

        }


        await buildState();


        startView.hidden = true;

        examView.hidden = false;


        setupSecurity();

        render();


    } catch (error) {

        console.error(
            "Attempt start failed:",
            error
        );

    } finally {

        startExamBtn.disabled = false;

        startExamBtn.textContent =
            "Start exam";

    }

}


/*
|--------------------------------------------------------------------------
| Build server-side timer
|--------------------------------------------------------------------------
*/

async function buildState() {

    const state =
        await api(
            "/api/attempts/" +
            encodeURIComponent(
                attemptId
            )
        );


    const durationMs =
        Number(
            state.duration_minutes
        ) *
        60 *
        1000;


    const serverStart =
        new Date(
            state.attempt.start_time
        ).getTime();


    const elapsed =
        Date.now() -
        serverStart;


    endAtMs =
        Date.now() +
        Math.max(
            0,
            durationMs - elapsed
        );


    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    timerInterval =
        setInterval(
            updateTimer,
            500
        );


    updateTimer();

}


/*
|--------------------------------------------------------------------------
| Update timer
|--------------------------------------------------------------------------
*/

function updateTimer() {

    const left =
        Math.max(
            0,
            endAtMs -
            Date.now()
        );


    timer.textContent =
        formatMs(left);


    if (left <= 0) {

        clearInterval(
            timerInterval
        );

        submit(true);

    }

}


/*
|--------------------------------------------------------------------------
| Format timer
|--------------------------------------------------------------------------
*/

function formatMs(milliseconds) {

    const totalSeconds =
        Math.floor(
            milliseconds / 1000
        );


    const minutes =
        String(
            Math.floor(
                totalSeconds / 60
            )
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            totalSeconds % 60
        ).padStart(
            2,
            "0"
        );


    return `${minutes}:${seconds}`;

}


/*
|--------------------------------------------------------------------------
| Render question
|--------------------------------------------------------------------------
*/

function render() {

    if (!examData) {
        return;
    }


    const questions =
        examData.questions || [];


    if (!questions.length) {

        qText.textContent =
            "No questions available.";

        options.innerHTML = "";

        return;

    }


    const question =
        questions[index];


    progress.textContent =
        `Question ${
            index + 1
        } of ${
            questions.length
        }`;


    qText.textContent =
        question.text;


    options.innerHTML = "";


    const selected =
        answers[
            question.question_id
        ] || [];


    for (
        const option
        of getOptions(question)
    ) {

        const label =
            document.createElement(
                "label"
            );


        label.className =
            "answer-option";


        const inputType =
            question.type === "MSQ"
                ? "checkbox"
                : "radio";


        const checked =
            selected.includes(
                option.index
            );


        label.innerHTML = `
            <input
                type="${inputType}"
                name="answer"
                value="${option.index}"
                ${checked ? "checked" : ""}
            >

            <span>
                ${String.fromCharCode(
                    65 + option.index
                )}.

                ${escapeHtml(
                    option.option_text
                )}
            </span>
        `;


        label
            .querySelector(
                "input"
            )
            .addEventListener(
                "change",
                saveCurrent
            );


        options.appendChild(
            label
        );

    }


    /*
    | Question navigation
    */

    nav.innerHTML =
        questions
            .map(
                (question, questionIndex) => {

                    const selectedAnswer =
                        answers[
                            question.question_id
                        ] || [];


                    return `

                        <button
                            type="button"
                            class="nav-dot
                                ${
                                    selectedAnswer.length
                                        ? "answered"
                                        : ""
                                }
                                ${
                                    questionIndex === index
                                        ? "current"
                                        : ""
                                }
                            "
                            onclick="go(${questionIndex})"
                        >
                            ${questionIndex + 1}
                        </button>

                    `;

                }
            )
            .join("");


    prev.disabled =
        index === 0;


    next.textContent =
        index === questions.length - 1
            ? "Review"
            : "Next";

}


/*
|--------------------------------------------------------------------------
| Get options
|--------------------------------------------------------------------------
*/

function getOptions(question) {

    return (
        question.options ||
        [0, 1, 2, 3].map(
            (optionIndex) => ({
                index: optionIndex,
                option_text: "",
            })
        )
    );

}


/*
|--------------------------------------------------------------------------
| Save current answer
|--------------------------------------------------------------------------
*/

function saveCurrent() {

    if (
        !examData ||
        !examData.questions[index]
    ) {
        return;
    }


    const question =
        examData.questions[index];


    const selected = [
        ...document.querySelectorAll(
            'input[name="answer"]:checked'
        ),
    ].map(
        (input) =>
            Number(input.value)
    );


    answers[
        question.question_id
    ] = selected;


    api(
        "/api/attempts/" +
        encodeURIComponent(
            attemptId
        ) +
        "/answers",
        "PUT",
        {
            answers: {
                [question.question_id]:
                    selected,
            },
        }
    ).catch(
        (error) => {
            console.error(
                "Answer save failed:",
                error
            );
        }
    );

}


/*
|--------------------------------------------------------------------------
| Navigate to question
|--------------------------------------------------------------------------
*/

function go(questionIndex) {

    saveCurrent();

    index =
        questionIndex;

    render();

}


/*
|--------------------------------------------------------------------------
| Next
|--------------------------------------------------------------------------
*/

next.onclick = () => {

    saveCurrent();

    if (
        index <
        examData.questions.length - 1
    ) {

        index++;

    }

    render();

};


/*
|--------------------------------------------------------------------------
| Previous
|--------------------------------------------------------------------------
*/

prev.onclick = () => {

    saveCurrent();

    if (index > 0) {

        index--;

    }

    render();

};


/*
|--------------------------------------------------------------------------
| Submit
|--------------------------------------------------------------------------
*/

async function submit(auto = false) {

    if (!attemptId) {
        return;
    }


    /*
    | Prevent duplicate submits
    */

    if (
        window.examSubmitting
    ) {
        return;
    }


    window.examSubmitting = true;


    try {

        saveCurrent();


        const response =
            await api(
                "/api/attempts/" +
                encodeURIComponent(
                    attemptId
                ) +
                "/submit",
                "POST",
                {
                    auto,
                }
            );


        if (response.result_id) {

            location =
                "/student/result/" +
                encodeURIComponent(
                    response.result_id
                );

        }

    } catch (error) {

        window.examSubmitting = false;

        console.error(
            "Exam submission failed:",
            error
        );

    }

}


/*
|--------------------------------------------------------------------------
| Submit button
|--------------------------------------------------------------------------
*/

submitBtn.onclick = () => {

    const confirmed =
        window.confirm(
            "Are you sure you want to submit the examination?"
        );


    if (!confirmed) {
        return;
    }


    submit(false);

};


/*
|--------------------------------------------------------------------------
| Fullscreen
|--------------------------------------------------------------------------
*/

fullscreen.onclick = async () => {

    try {

        await document.documentElement
            .requestFullscreen?.();

    } catch (error) {

        console.warn(
            "Fullscreen request failed:",
            error
        );

    }

};


/*
|--------------------------------------------------------------------------
| Exam security
|--------------------------------------------------------------------------
*/

function setupSecurity() {

    if (
        securityInitialized
    ) {
        return;
    }


    securityInitialized = true;


    /*
    | Visibility change
    */

    document.addEventListener(
        "visibilitychange",
        () => {

            if (!document.hidden) {
                return;
            }


            api(
                "/api/attempts/" +
                encodeURIComponent(
                    attemptId
                ) +
                "/events",
                "POST",
                {
                    event_type:
                        "tab_or_app_switch",
                }
            ).catch(
                console.error
            );


            if (
                examData.exam
                    .visibility_auto_submit
            ) {

                submit(true);

            }

        }
    );


    /*
    | Window blur
    */

    window.addEventListener(
        "blur",
        () => {

            api(
                "/api/attempts/" +
                encodeURIComponent(
                    attemptId
                ) +
                "/events",
                "POST",
                {
                    event_type:
                        "window_blur",
                }
            ).catch(
                console.error
            );

        }
    );


    /*
    | Copy / Paste / Cut /
    | Context menu
    */

    for (
        const eventName
        of [
            "copy",
            "paste",
            "cut",
            "contextmenu",
        ]
    ) {

        document.addEventListener(
            eventName,
            (event) => {

                event.preventDefault();


                api(
                    "/api/attempts/" +
                    encodeURIComponent(
                        attemptId
                    ) +
                    "/events",
                    "POST",
                    {
                        event_type:
                            eventName +
                            "_blocked",
                    }
                ).catch(
                    console.error
                );

            }
        );

    }


    /*
    | Common shortcuts
    */

    document.addEventListener(
        "keydown",
        (event) => {

            if (
                (event.ctrlKey ||
                    event.metaKey) &&
                [
                    "c",
                    "v",
                    "x",
                    "p",
                    "s",
                    "u",
                ].includes(
                    event.key.toLowerCase()
                )
            ) {

                event.preventDefault();


                api(
                    "/api/attempts/" +
                    encodeURIComponent(
                        attemptId
                    ) +
                    "/events",
                    "POST",
                    {
                        event_type:
                            "shortcut_blocked",

                        metadata: {
                            key: event.key,
                        },
                    }
                ).catch(
                    console.error
                );

            }

        }
    );


    /*
    | Fullscreen exit
    */

    document.addEventListener(
        "fullscreenchange",
        () => {

            if (
                !document.fullscreenElement
            ) {

                api(
                    "/api/attempts/" +
                    encodeURIComponent(
                        attemptId
                    ) +
                    "/events",
                    "POST",
                    {
                        event_type:
                            "fullscreen_exit",
                    }
                ).catch(
                    console.error
                );

            }

        }
    );


    /*
    | Request fullscreen
    */

    document.documentElement
        .requestFullscreen
        ?.()
        .catch?.(
            () => {}
        );

}


/*
|--------------------------------------------------------------------------
| Start form
|--------------------------------------------------------------------------
*/

document
    .getElementById("startForm")
    .addEventListener(
        "submit",
        start
    );


/*
|--------------------------------------------------------------------------
| Load exam
|--------------------------------------------------------------------------
*/

load();

</script>

{% endblock %}
